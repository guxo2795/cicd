name: Spring Boot CI

# 언제 실행할지
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# 무엇을 할지
jobs:
  build:
    # 어떤 환경에서
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Docker build
        run: docker build -t spring-docker-cd .